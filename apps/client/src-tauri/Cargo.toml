[package]
name = "echoo-client"
version = "0.1.0"
description = "Echoo desktop and mobile shell"
authors = ["Echoo"]
edition = "2021"

[lib]
name = "echoo_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "echoo-client"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-keepalive = { path = "../../../crates/tauri-plugin-keepalive" }
tauri-plugin-notification = "2"
